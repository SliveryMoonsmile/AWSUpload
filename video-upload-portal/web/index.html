<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Upload Portal</title><style>body{font:16px system-ui;margin:3rem auto;max-width:640px;background:#0b1020;color:#e7ecff}input,button{margin:.65rem 0;padding:.7rem;width:100%;box-sizing:border-box}button{background:#66d9ef;border:0;font-weight:700}progress{width:100%}#status{white-space:pre-wrap}</style></head><body><h1>Secure Upload Portal</h1><p>Sign-in token required. Uploads go directly to private S3 storage.</p><label>JWT access token<input id="token" type="password" autocomplete="off" placeholder="Cognito access token"></label><label>Select video or file<input id="file" type="file" accept="video/mp4,video/webm,video/quicktime,application/pdf,image/png,image/jpeg,text/plain"></label><button id="upload">Upload</button><progress id="progress" value="0" max="100" hidden></progress><p id="status"></p><script src="app.js"></script></body></html>
